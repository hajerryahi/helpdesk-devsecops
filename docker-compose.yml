# Lancement local : docker compose up --build  ->  http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: "Passw0rd!"   # F5 : meme secret de test qu'en dur dans config.py
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      SEED_PASSWORD: "Test1234!"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python seed.py && python run.py"

volumes:
  pgdata:
